spring.application.name=api-arquitetura-example

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# Atuador endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# Health especifico
management.health.defaults.enabled=true

# Logging para tracing (opcional)
logging.level.org.springframework.orm=DEBUG
logging.level.org.springframework.transaction=DEBUG


# Logging Configuration
logging.level.com.api_arquitetura_example=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Metrics Configuration
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.slo.http.server.requests=10ms,100ms,1s

# Tracing Configuration
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

# OTLP endpoint for Jaeger
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces

# Ou usando Zipkin (alternativa)
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans


